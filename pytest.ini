[pytest]
testpaths = tests
norecursedirs =
    .git
    .pytest_cache
    .venv
    venv
    __pycache__
    scratch
    media
    models
    src/backend/engines/.cache
addopts = -p no:cacheprovider
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests