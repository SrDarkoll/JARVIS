[project]
name = "jarvis"
version = "0.1.0"
description = "J.A.R.V.I.S. - Local desktop AI assistant"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "PL",    # pylint (errors only)
]
ignore = [
    "PLR0913",   # Too many arguments
    "PLR2004",   # Magic value compared against variable
    "B008",      # Do not perform function call in argument defaults
]

[tool.pyright]
include = ["src/backend"]
exclude = ["**/__pycache__", "**/scratch", "**/.venv", "**/tests"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.coverage.run]
source = ["src/backend"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 45
show_missing = true
skip_covered = true